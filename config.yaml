# Non-secret settings. Relative paths resolve against the project root (or $CIW_ROOT).
# Secrets (PATREON_FEED_URL, HF_TOKEN, ANTHROPIC_API_KEY, NTFY_TOPIC) live only in .env.
blog_db: cooking_issues.db
data_dir: data
audio_dir: /mnt/ssd0/ciw/audio
clips_dir: /mnt/ssd0/ciw/clips
state_db: data/state.sqlite
search_db: data/search.sqlite   # transcript + show-notes FTS5 index (`ciw index`); rebuildable

apple_ids:
  acast: 1572356745
  hrn: 380317598
poll_interval_hours: 6

asr:
  backend: whisperx           # registry key (ciw.asr); parakeet may follow in T13
  model: large-v3
  batch_size: 8               # first batch size tried; halved on CUDA OOM down to min_batch_size,
  min_batch_size: 2           # then the same ladder again with fallback_compute_type
  compute_type: float16
  fallback_compute_type: int8_float16
  device: cuda
  vad: pyannote               # VAD is always on; pyannote or silero
  language: en
  diarize: true               # needs HF_TOKEN in .env; without it speakers are skipped, not fatal
  diarization_model: pyannote/speaker-diarization-community-1
  hf_home: /mnt/ssd0/ciw/hf_cache   # HF_HOME; TORCH_HOME is <hf_home>/torch (not ~/.cache)
  vocabulary_file: vocab/vocabulary.txt   # one jargon term per line, most valuable first;
                                          # drives the correction pass (ciw.correct)
  vocabulary_prompt: false    # also feed it to Whisper as initial_prompt (cut at 600 chars). OFF:
                              # it fixes jargon but makes large-v3 drop 7-18% of the speech (T6)
  aliases_file: vocab/aliases.txt         # `heard => correct` pairs (known recurring mis-hearings)
  correct: true               # run the post-ASR correction pass after transcribing
  correct_min_confidence: 0.86  # bar for fuzzy (non-alias) corrections

llm:
  model: claude-sonnet-5-5
  monthly_budget_usd: 25          # hard cap; every call is recorded in state.sqlite (llm_usage)
  prompt_file: prompts/compare.yaml   # `ciw compare`: prompt, schema, matrix, sample episodes
  compare_dir: data/compare
  concurrency: 3
  max_usd_per_run: 10             # `ciw compare run` stops before a run passes this
  max_retries: 2

notify:
  server: https://ntfy.sh
  topic_env: NTFY_TOPIC   # the topic is a secret: read from this environment variable
  threshold: 7
  clip_threshold: 9

download:
  min_free_gb: 20   # refuse to start a download below this much free space on audio_dir's disk
  duration_tolerance_s: 120    # ffprobe duration vs the feed's: max(this, pct of the duration)
  duration_tolerance_pct: 0.10   # a fraction (0.10 = 10%); real audio runs up to ~5% over the feed

backfill:                 # `ciw backfill plan|run|status|stop|retry`
  order: [acast, patreon, hrn]   # source order; newest first within a source (patreon = Patreon-only episodes)
  prefetch: 2             # episodes downloaded ahead of the one being transcribed
  max_attempts: 3         # failures before an episode is parked (`ciw backfill retry` resets)
  retry_backoff_minutes: [10, 60, 360]   # cool-down after the 1st, 2nd, 3rd+ failure
  suspect_gap_pct: 5      # silent gaps (>= 10 s) over this % of the audio flag the episode
  log_dir: data/logs      # backfill-YYYYMMDD.jsonl (rotated daily, 14 kept, 20 MB cap each)
  log_keep_files: 14
  log_max_mb: 20
  stop_file: data/STOP    # `ciw backfill stop` creates it; the run exits after the current episode

web:
  host: 127.0.0.1
  port: 5000
  debug: false
