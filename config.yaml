# Non-secret settings. Relative paths resolve against the project root (or $CIW_ROOT).
# Secrets (PATREON_FEED_URL, HF_TOKEN, ANTHROPIC_API_KEY, NTFY_TOPIC) live only in .env.
blog_db: cooking_issues.db
data_dir: data
audio_dir: /mnt/ssd0/ciw/audio
clips_dir: /mnt/ssd0/ciw/clips
state_db: data/state.sqlite

apple_ids:
  acast: 1572356745
  hrn: 380317598
poll_interval_hours: 6

asr:
  backend: whisperx           # registry key (ciw.asr); parakeet may follow in T13
  model: large-v3
  batch_size: 8               # first batch size tried; halved on CUDA OOM down to min_batch_size,
  min_batch_size: 2           # then the same ladder again with fallback_compute_type
  compute_type: float16
  fallback_compute_type: int8_float16
  device: cuda
  vad: pyannote               # VAD is always on; pyannote or silero
  language: en
  diarize: true               # needs HF_TOKEN in .env; without it speakers are skipped, not fatal
  diarization_model: pyannote/speaker-diarization-community-1
  hf_home: /mnt/ssd0/ciw/hf_cache   # HF_HOME; TORCH_HOME is <hf_home>/torch (not ~/.cache)
  vocabulary_file: null       # one jargon term per line; becomes Whisper's initial_prompt (T6)

llm:
  model: claude-sonnet-5-5
  monthly_budget_usd: 25

notify:
  server: https://ntfy.sh
  topic_env: NTFY_TOPIC   # the topic is a secret: read from this environment variable
  threshold: 7
  clip_threshold: 9

download:
  min_free_gb: 20   # refuse to start a download below this much free space on audio_dir's disk
  duration_tolerance_s: 120    # ffprobe duration vs the feed's: max(this, pct of the duration)
  duration_tolerance_pct: 0.05

web:
  host: 127.0.0.1
  port: 5000
  debug: false
