# Model/effort comparison (T9 step 0): `ciw compare plan|run|status|report|score`.
#
# YOU EDIT: system, user, schema, checks. The run matrix and the sample are set up already.
#
# Editing system / user / schema starts a NEW run (results are kept per prompt hash under
# data/compare/run-<hash>/). Editing matrix, sample, checks or max_tokens does not.
#
# Placeholders usable in system and user (plain {{name}} replacement; JSON braces are safe):
#   {{title}}  {{pub_date}}  {{duration}}  {{show_notes}}  {{transcript}}
# {{transcript}} is "[mm:ss] SPEAKER_01: text" lines (words already vocabulary-corrected).
# `ciw compare run` refuses while either prompt still contains the word TODO.

system: |
  Your goal is to both summarize the content of a podcast, extract any explicit (or implicit)
  recipes, and find the timestamp at which I should start listening to the podcast. More on each below.

  Summary: summarize cooking and cocktail-related content, ignore pop culture and anything unrelated
  to food. This top level summary should not compress detail and should carry specific details. The
  summary should also contain general advice that does not fit into a specific recipe as described below.

  Recipes: identify explicit or implicit recipes. A recipe might be an idea that includes a few ingredients
  paired with a method, or an explicit statement of amounts/ratios. Create recipes of both types with
  a unitless ingredients list, ratio of ingredients list, or specific ingredients list.

  Timestamp: each podcast often starts with general discussions which include pop culture and
  "the week in review." This discussion is often unrelated to the main goals of the podcast. Identify a
  listening starting point that avoids this nonsense. There may be some interesting recipes that should still
  be included in the above task, but weigh their appeal vs. the length of non-cooking discussion.

user: |
  Episode: {{title}} ({{pub_date}}, {{duration}})

  Show notes (a rough guide to what is interesting; they rarely include the opening chatter):
  {{show_notes}}

  Transcript (each line starts with its [mm:ss] time):
  {{transcript}}

# JSON Schema for the answer (structured outputs). Rules: the root and every nested object need
# "additionalProperties: false" and every property listed in "required". Property order matters
# for the checks: recipes come before start_listening_at so that the out-of-order timestamp count
# is not tripped by a good recipe that sits before the chosen start point.
schema:
  type: object
  additionalProperties: false
  required: [summary, recipes, start_listening_at, start_reason]
  properties:
    summary:
      type: string
      description: Detailed summary of the cooking and cocktail content, with specifics and any general advice that is not part of a single recipe.
    recipes:
      type: array
      description: Recipes in the order they come up in the episode.
      items:
        type: object
        additionalProperties: false
        required: [recipe_title, kind, basis, amount_style, timestamp, ingredients, method, evidence]
        properties:
          recipe_title: {type: string}
          kind: {type: string, enum: [food, cocktail]}
          basis: {type: string, enum: [explicit, implicit], description: "explicit = the speakers state it as a recipe; implicit = ingredients and a method pieced together from discussion"}
          amount_style: {type: string, enum: [specific, ratio, unitless]}
          timestamp: {type: string, description: "[mm:ss] copied from the transcript line where the recipe starts"}
          ingredients:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [item, amount]
              properties:
                item: {type: string}
                amount: {type: string, description: "exact amount, ratio part (e.g. 2 parts), or empty string if none was stated"}
          method:
            type: array
            items: {type: string}
          evidence:
            type: string
            description: Verbatim quote (at most 25 words, from a single speaker turn) that supports the recipe.
    start_listening_at:
      type: string
      description: "[mm:ss] copied from the transcript line where I should start listening"
    start_reason:
      type: string
      description: One or two sentences on why, including what you skipped and any recipe you decided to leave before the start point.

# Automatic checks, by JSON key name (anywhere in the output). A check you do not name is skipped.
checks:
  quote_fields: [evidence]                       # must appear in the transcript (verbatim, or nearly)
  timestamp_fields: [timestamp, start_listening_at]  # mm:ss, h:mm:ss or seconds, inside the episode
  list_fields: [recipe_title, item]              # overlap with the reference output (Jaccard)

# Output budget per call (thinking tokens count against it). Truncated answers are recorded
# as "truncated" and rated like any other; `ciw compare run --retry-bad` redoes them.
max_tokens: 32000

# 7 configurations. Effort: low | medium | high | xhigh | max.
matrix:
  - {id: haiku-medium,  model: claude-haiku-5-5,  effort: medium}
  - {id: haiku-high,    model: claude-haiku-5-5,  effort: high}
  - {id: haiku-xhigh,   model: claude-haiku-5-5,  effort: xhigh}
  - {id: sonnet-medium, model: claude-sonnet-5-5, effort: medium}
  - {id: sonnet-high,   model: claude-sonnet-5-5, effort: high}
  - {id: sonnet-xhigh,  model: claude-sonnet-5-5, effort: xhigh}
  - {id: opus-medium,   model: claude-opus-5-5,   effort: medium}

# The reference for the agreement check (the review itself is blind: the page never says which
# output is which).
reference: opus-medium

# 10 episodes. `ciw compare run --episodes 3` takes the first three (stage 1), `--all` the rest.
sample:
  - 69715223a6c658f1834fb3d6   # Biscuits, Bouillon and Beyond (fixture; home carbonation)
  - 6ab1e27735231e4f55e430e2   # Tiny Trash Trucks: OG Crew NTT (mostly etiquette)
  - hrn-6529293a5255ef04       # Episode 56: Chris Young (2011; guest; old audio, flagged suspect)
  - 6aa9940ebf7eb386d361b8c3   # NTT: Back from Lima (one brisket hit in a travel episode)
  - 69d52a583ae78d6f11c8a113   # Belated Birthday Tangents (ratios buried in tangents)
  - 6a44f90d6771af4aa44f182b   # Inside Burger King's Culinary Innovation Lab (business + technique)
  - patreon-4a5c679ed6c92ea9   # Fireplaces, Crisco Mysteries & Live-Fire Cooking (Patreon-only)
