  - 6a44f90d6771af4aa44f182b   # Inside Burger King's Culinary Innovation Lab (business + technique)
  - patreon-4a5c679ed6c92ea9   # Fireplaces, Crisco Mysteries & Live-Fire Cooking (Patreon-only)
