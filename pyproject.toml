[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciw"
version = "0.1.0"
description = "Cooking Issues archive site plus podcast segment watcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "typer",
    "pydantic>=2",
    "pyyaml",
    "requests",
    "beautifulsoup4",
    "lxml",
    "httpx",
    "feedparser",
    "anthropic",
    "wordfreq>=3.1,<4",  # common-English test for the vocabulary builder and the correction guard
    "jellyfish>=1.0",  # phonetic keys (metaphone) and edit distance for ciw.correct
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Speech recognition (T5). Heavy, so never a core dependency; every import of these is lazy.
# torch/torchaudio must be the CUDA 12.8 wheels from the PyTorch index (the PyPI wheels also
# work with driver 580 but pull a different CUDA runtime), e.g.:
#   pip install "torch==2.8.0" "torchaudio==2.8.0" "torchvision==0.23.0" \
#       --index-url https://download.pytorch.org/whl/cu128
#   pip install -e ".[asr]"
# WhisperX 3.8.x pins torch~=2.8.0, so these bounds track its requirements.
asr = [
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "whisperx>=3.8.6,<3.9",
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.3",
    "pyannote.audio>=4.0.7",
]

[project.scripts]
ciw = "ciw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ciw.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the NVIDIA GPU, the downloaded ASR models and real audio (skipped by default; run with -m gpu)",
    "real_paths: may use the real repo config and paths (opt-in to the test-safety guard in ciw.config)",
]
addopts = "-m 'not gpu'"
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # typer uses function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["ciw"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings in the moved scraper are left as-is (behavior-neutral move).
"src/ciw/blog/scrape.py" = ["E501"]

[tool.ruff.format]
exclude = ["*.md"]  # don't reformat code blocks inside docs
